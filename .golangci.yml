version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - goconst
    - gocritic
    - misspell
    - unconvert
    - unparam
    - wastedassign

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst
          - unparam
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
