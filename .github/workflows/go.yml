name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.27.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Verify modules
        run: go mod verify
      - name: Format
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: make test-race

      - name: Sync knowledge check
        run: make sync-check
